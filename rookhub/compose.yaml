# Lokaler Eröffnungs-Explorer (lila-openingexplorer, Fork unter ~/claude/rookhubstack/explorer).
# Liefert /lichess und /masters wie explorer.lichess.ovh — für den Lochfinder in rookhub.
# Der Explorer hat keine Authentifizierung: Admin-Endpoints (/import/*, /compact) und /player (lädt
# beliebige Lichess-Konten in die DB) erreichen nur localhost und das Netz default (explorer-sync).
# Die rookhub-Netze (PROD + DEV) sehen nur den Gateway explorer-gateway: GET /lichess, GET /masters.
services:
  explorer:
    image: rookhub-explorer:latest
    container_name: rookhub-explorer
    restart: unless-stopped
    user: "1000:1000"                # Dateien auf der Datenplatte gehören kahalm
    command:
      - lila-openingexplorer
      - --bind=0.0.0.0:9002
      - --db=/data/db
      - --db-compaction-readahead
      - --db-cache=3221225472        # 3 GiB Block-Cache (2026-09-23 von 6 GiB gesenkt: Host-RAM knapp)
      - --db-rate-limit=67108864     # 64 MiB/s Schreiblimit für Flush/Compaction (HDD)
    ulimits:
      nofile: 131072
    volumes:
      - /mnt/disks/sdf/rookhub-explorer:/data
    ports:
      - "127.0.0.1:9002:9002"        # nur lokal: Import-Jobs + Tests vom Host
    labels:
      - com.centurylinklabs.watchtower.enable=false   # lokal gebautes Image, nichts zu ziehen
    networks:
      - default                      # nur Gateway + explorer-sync; NICHT in die rookhub-Netze hängen
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9002/monitor"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Einziger Weg aus den rookhub-Netzen zum Explorer: reicht nur GET /lichess und GET /masters durch,
  # alles andere = 403 (explorer-gateway.conf). Alias rookhub-explorer: LICHESS_EXPLORER_LOCAL_URL=
  # http://rookhub-explorer:9002/ in beiden rookhub-Stacks bleibt unverändert und landet hier.
  explorer-gateway:
    image: nginx:1.30-alpine           # stabiler Zweig; Watchtower zieht nur Patch-Releases
    container_name: rookhub-explorer-gateway
    restart: unless-stopped
    volumes:
      - ./explorer-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default:
      rookhub:
        aliases: [rookhub-explorer]
      rookhub-dev:
        aliases: [rookhub-explorer]

networks:
  rookhub:
    external: true
    name: rookhub-schach_rookhub
  rookhub-dev:
    external: true
    name: rookhub-schach-dev_rookhub-dev
