# Gateway vor dem lokalen Explorer (Service explorer-gateway in compose.yaml). Der Explorer hat keine
# Authentifizierung; upstream verlangt einen Reverse-Proxy vor den Admin-Routen. Aus den rookhub-Netzen
# kommen deshalb nur die beiden Leseabfragen des Lochfinders durch (LichessExplorerClient.BuildUrl/
# BuildGamesUrl: GET /lichess?…, GET /masters?…). Alles andere — /compact, /import/*, /player,
# /personal, /monitor, /masters/pgn/… — endet hier mit 403.

# Nur Ablehnungen und Fehler protokollieren; jede erfolgreiche Lochfinder-Abfrage würde das Docker-Log
# (json-file ohne Rotation) füllen.
map $status $explorer_gateway_log {
    ~^[23]  0;
    default 1;
}

server {
    listen 9002;
    server_tokens off;
    access_log /var/log/nginx/access.log combined if=$explorer_gateway_log;

    # Docker-DNS zur Laufzeit statt einmal beim Start: der Explorer-Container bekommt beim Neuerstellen
    # eine neue IP, und der Gateway startet auch, wenn der Explorer gerade fehlt (dann 502).
    # Name "explorer" (Service-Alias, nur im Netz default) — NICHT "rookhub-explorer": den trägt in
    # den rookhub-Netzen der Gateway selbst.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $explorer_upstream explorer:9002;

    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Weitergereicht wird der normalisierte Pfad (fest) plus die Abfrage, nie der Roh-Pfad des Clients.
    location = /lichess {
        limit_except GET { deny all; }
        proxy_pass http://$explorer_upstream/lichess$is_args$args;
    }

    location = /masters {
        limit_except GET { deny all; }
        proxy_pass http://$explorer_upstream/masters$is_args$args;
    }

    location / {
        return 403;
    }
}
