name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y valgrind liburing-dev
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
        env:
          RUSTFLAGS: --cfg tokio_unstable
      - run: cargo bench
      - run: cargo test --manifest-path import-pgn/Cargo.toml
      # seed-db.sh and README.md rely on plain `cargo run` (default-run = import-lichess).
      - run: cargo run --manifest-path import-pgn/Cargo.toml -- --help
